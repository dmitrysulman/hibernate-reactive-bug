plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.hibernate.reactive:hibernate-reactive-core:4.5.5.Final'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'ch.qos.logback:logback-classic:1.6.3'

    testRuntimeOnly 'tools.jackson.core:jackson-databind:3.2.2'
    testRuntimeOnly 'io.vertx:vertx-mysql-client:5.1.6'
    testRuntimeOnly 'com.mysql:mysql-connector-j:9.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}